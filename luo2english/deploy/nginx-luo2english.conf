server {
    listen 80;
    listen [::]:80;
    server_name www.swiftener.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.swiftener.com;

    ssl_certificate /etc/letsencrypt/live/www.swiftener.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.swiftener.com/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
